
bundle:
  name: travel-data-platform

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405612670705571.11.azuredatabricks.net

resources:
  jobs:
    travel_pipeline:
      name: travel-pipeline
      tasks:
        - task_key: bronze
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          existing_cluster_id: 1120-103339-7dsypswr
          notebook_task:
            notebook_path: ./databricks/notebooks/01_bronze_ingestion.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          existing_cluster_id: 1120-103339-7dsypswr
          notebook_task:
            notebook_path: ./databricks/notebooks/02_silver_transform.py

        - task_key: gold
          depends_on:
            - task_key: silver
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          existing_cluster_id: 1120-103339-7dsypswr
          notebook_task:
            notebook_path: ./databricks/notebooks/03_gold_aggregation.py
